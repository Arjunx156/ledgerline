# The public demo on Render's free tier (stage S2b): the API in demo mode,
# and the bare page on a second origin, so cross-origin calls and the event
# stream are tested exactly as the console will use them. Postgres is Neon.
# Setup: README, "Deploying the demo".

services:
  - type: web
    name: ledgerline-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      # The app role's direct (not -pooler) Neon URL: LISTEN needs a session.
      - key: LEDGERLINE_DATABASE_URL
        sync: false
      - key: LEDGERLINE_DEMO_ORIGINS
        value: https://ledgerline-skeleton.onrender.com
      # Render's Cloudflare edge sets this to the visitor's address and
      # refuses requests that send their own.
      - key: LEDGERLINE_CLIENT_IP_HEADER
        value: CF-Connecting-IP

  - type: web
    name: ledgerline-skeleton
    runtime: static
    buildCommand: echo "plain files, no build step"
    staticPublishPath: ./web/skeleton
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://ledgerline-api.onrender.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
