name: ci

# Every pushed branch, so a stage is checked before its PR opens; the PR
# shows these same results.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerline -d ledgerline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      LEDGERLINE_TEST_DATABASE_URL: postgres://ledgerline:ledgerline@localhost:5432/ledgerline?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - run: just check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
